name: Release

# Builds distributable assets for a tagged release, generates a CycloneDX
# software bill of materials (SBOM), signs every asset with Sigstore
# keyless signing, and attaches everything to the GitHub release.
#
# Also supports manual backfill: `workflow_dispatch` with a `tag` input
# will run the pipeline against an existing release tag.

on:
  push:
    tags:
      - "v*"
      - "draft-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to backfill (e.g. v0.9.0). Leave empty to use the pushed tag."
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target ref
        id: ref
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "is_backfill=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_backfill=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build --outdir dist/

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          for asset in dist/*; do
            cosign sign-blob --yes \
              --output-certificate "$asset.pem" \
              --output-signature "$asset.sig" \
              "$asset"
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > ../SHA256SUMS
          cd ..
          # also checksum the SBOM so its integrity is verifiable
          sha256sum sbom.cdx.json >> SHA256SUMS

      - name: Create/update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ref.outputs.tag }}
          files: |
            dist/*
            dist/*.sig
            dist/*.pem
            sbom.cdx.json
            SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true
