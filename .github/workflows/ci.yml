name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Verify CLI entry points load
        run: |
          aci-validate --help
          aci-explore --help
      - name: Smoke-validate example agent files
        run: |
          for f in examples/level1/* examples/level2/*; do
            if [ -f "$f" ]; then
              echo "Validating $f"
              aci-validate "$f" || exit 1
            fi
          done
