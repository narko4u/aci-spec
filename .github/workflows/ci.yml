name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify all commits carry Signed-off-by (DCO)
        run: |
          set -e
          BASE="${GITHUB_EVENT_PULL_REQUEST_BASE_SHA:-${{ github.event.pull_request.base.sha }}}"
          HEAD="${GITHUB_EVENT_PULL_REQUEST_HEAD_SHA:-${{ github.event.pull_request.head.sha }}}"
          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
            echo "Skipping DCO check outside pull_request context"
            exit 0
          fi
          bad=""
          for c in $(git rev-list "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q "^Signed-off-by: "; then
              echo "::error::commit $c is missing Signed-off-by trailer (DCO)"
              bad=1
            fi
          done
          if [ -n "$bad" ]; then
            echo "All commits must include a Signed-off-by trailer. Use: git commit -s"
            exit 1
          fi
          echo "DCO check passed"

  validate-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Verify CLI entry points load
        run: |
          aci-validate --help >/dev/null
          aci-explore --help >/dev/null
      - name: Verify schemas load and example manifests are valid JSON
        run: |
          python - <<'EOF'
          import json, glob
          from aci_validator.validate import load_schemas, SCHEMA_DIR
          schemas, order = load_schemas(SCHEMA_DIR)
          assert set(order) >= {"identity", "capability", "knowledge", "trust", "agents"}, order
          print(f"schemas OK: {order}")
          files = glob.glob("examples/**/*.json", recursive=True)
          assert files, "no example JSON files found"
          for f in files:
              json.load(open(f))
          print(f"{len(files)} example JSON files parse OK")
          EOF

  # Aggregator: branch protection requires a check named "validate", but
  # matrix jobs report as "validate (3.x)". This job produces a check that
  # matches the required context and only passes when the matrix legs pass.
  validate:
    runs-on: ubuntu-latest
    needs: validate-matrix
    steps:
      - name: All validation legs passed
        run: echo "validate matrix completed"
