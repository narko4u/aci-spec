[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aci-spec"
version = "0.9.0"
description = "Autonomous Company Interface — validate and explore ACI implementations for agent-to-organization interaction"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Empire Labs Pty Ltd", email = "contact@empirelabs.com.au"}
]
maintainers = [
    {name = "Sovereign", email = "contact@empirelabs.com.au"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/narko4u/aci-spec"
Repository = "https://github.com/narko4u/aci-spec"
Documentation = "https://github.com/narko4u/aci-spec#readme"

[project.scripts]
aci-validate = "aci_validator.validate:main"
aci-explore = "aci_validator.explorer:main"

[tool.setuptools.packages.find]
include = ["aci_validator*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
aci_validator = ["schemas/*.yaml"]
